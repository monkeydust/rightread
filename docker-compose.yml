# `version` is obsolete in Compose v2 but REQUIRED here: the server has
# docker-compose v1.29.2, which without it falls back to the legacy v1
# file format where top-level keys are service names — so `services:`
# would be read as a service called "services" and the file fails.
version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Host ports already taken on the Hetzner box: 3000 uk-property-analyzer
      # (rightdata.uk), 3001 rightmind, 3002 previously used by a Caddy
      # listener. Caddy proxies read.rightdata.uk to this one.
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/production.db
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_RESEND_KEY=${AUTH_RESEND_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      # Must be listed here, not merely present in .env.prod: --env-file makes
      # a variable available for ${...} substitution in this file, it does NOT
      # pass it into the container. Anything the app reads at runtime needs an
      # explicit entry below.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
