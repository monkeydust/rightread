# `version` is obsolete in Compose v2 but REQUIRED here: the server has
# docker-compose v1.29.2, which without it falls back to the legacy v1
# file format where top-level keys are service names — so `services:`
# would be read as a service called "services" and the file fails.
version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Host ports already taken on the Hetzner box: 3000 uk-property-analyzer
      # (rightdata.uk), 3001 rightmind, 3002 previously used by a Caddy
      # listener. Caddy proxies read.rightdata.uk to this one.
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/production.db
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_RESEND_KEY=${AUTH_RESEND_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      # Must be listed here, not merely present in .env.prod: --env-file makes
      # a variable available for ${...} substitution in this file, it does NOT
      # pass it into the container. Anything the app reads at runtime needs an
      # explicit entry below.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # The :- defaults matter. Listing a variable here that is absent from
      # .env.prod passes it in as an EMPTY STRING, not as unset — so without a
      # default, adding an override knob here would blank the value it overrides.
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-5.6-luna}
      - OPENROUTER_EMBED_MODEL=${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-small}
      # Semantic similarity cut-off; see the measurements in lib/search/search.ts.
      - OPENROUTER_SEMANTIC_FLOOR=${OPENROUTER_SEMANTIC_FLOOR:-0.22}
      # Graph edge floor — a noise guard, not a relevance threshold; the
      # percentile banding does that work and calibrates itself per library.
      # NOT interchangeable with OPENROUTER_SEMANTIC_FLOOR above, which is
      # query-to-document. This one is document-to-document.
      - GRAPH_EDGE_FLOOR=${GRAPH_EDGE_FLOOR:-0.15}
      - GRAPH_MAX_NODES=${GRAPH_MAX_NODES:-2000}
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
